services:
  vision-system:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    image: vision-system:latest
    container_name: vision-system
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

    # For USB camera testing on Linux/Raspberry Pi, uncomment:
    # devices:
    #   - /dev/video0:/dev/video0

    command:
      - "--profile"
      - "yellow_daifuku"
      - "--camera"
      - "0"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--imgsz"
      - "256"
      - "--frame-width"
      - "424"
      - "--frame-height"
      - "240"
      - "--inference-interval-ms"
      - "300"

    restart: unless-stopped
