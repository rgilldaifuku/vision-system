name: pi_camera3
backend: picamera2
width: 640
height: 480
fps: 30
rotation: 0
flip_horizontal: false
flip_vertical: false
exposure_mode: auto
exposure_time: null
gain: null
white_balance: auto
roi:
  enabled: false
  x1: 0.0
  y1: 0.0
  x2: 1.0
  y2: 1.0
preprocessing:
  enabled: true
  brightness_check: true
  blur_check: true
  color_normalization: false
quality:
  enabled: true
  min_brightness: 40
  max_brightness: 220
  min_blur_score: 50
  min_contrast: 15
  max_overexposed_pct: 20
  max_underexposed_pct: 20
  skip_inference_on_bad_quality: false
